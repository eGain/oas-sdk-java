openapi: 3.0.0
info:
  title: CustomAttributeL10NTitleParity
  version: 1.0.0
paths:
  /custom-attributes:
    get:
      operationId: listCustomAttributes
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomAttributeL10N'
components:
  schemas:
    L10NString:
      type: object
      required:
        - value
      properties:
        value:
          type: string
        displayValue:
          type: string
          readOnly: true
    CustomAttributeL10N:
      type: object
      properties:
        attribValues:
          type: array
          minItems: 1
          items:
            type: object
            title: L10NString
            required:
              - value
            properties:
              value:
                type: string
                minLength: 0
                maxLength: 255
              displayValue:
                type: string
                readOnly: true
